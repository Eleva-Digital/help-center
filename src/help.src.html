<!-- ELEVA-HELP:START -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
#elh{
  --bg:#0A0C0B; --surface:#131715; --surface2:#1A1F1C; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --text:#F1F4EF; --muted:#8C958E; --faint:#5C645E; --accent:#C8E26A; --accent-ink:#0A0C0B; --accent-soft:rgba(200,226,106,.12);
  --link:#C8E26A; --maint:#6FA8F5; --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 20px 50px -20px rgba(0,0,0,.6);
  color-scheme:dark;
}
#elh[data-theme="light"]{
  --bg:#F5F6F2; --surface:#FFFFFF; --surface2:#F3F5EF; --line:rgba(16,20,17,.08); --line2:rgba(16,20,17,.14);
  --text:#151916; --muted:#5D655F; --faint:#9AA19B; --accent:#A9CC2E; --accent-ink:#151916; --accent-soft:rgba(169,204,46,.16);
  --link:#5E7A0C; --maint:#3B82E6; --shadow:0 1px 2px rgba(16,20,17,.04),0 18px 40px -24px rgba(16,20,17,.18);
  color-scheme:light;
}
#elh,#elh *{box-sizing:border-box;margin:0;padding:0;border:0;font:inherit;color:inherit;background:none;text-decoration:none;list-style:none;letter-spacing:normal;text-transform:none;line-height:inherit}
#elh{font-family:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.55;background:var(--bg);color:var(--text);min-height:100vh;width:100%;-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden;overflow-x:clip;text-align:left;isolation:isolate}

/* ambient */
#elh .fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#elh .aurora{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform}
#elh .a1{width:640px;height:640px;left:50%;top:-340px;margin-left:-320px;background:var(--accent);opacity:.2;animation:ehD1 18s ease-in-out infinite alternate}
#elh .a2{width:460px;height:460px;left:-180px;top:240px;background:#4FD1C5;opacity:.09;animation:ehD2 24s ease-in-out infinite alternate}
#elh .a3{width:520px;height:520px;right:-220px;top:60px;background:#7C8CF8;opacity:.08;animation:ehD3 28s ease-in-out infinite alternate}
#elh[data-theme="light"] .aurora{opacity:.12}
@keyframes ehD1{to{transform:translate(60px,40px) scale(1.15)}}
@keyframes ehD2{to{transform:translate(140px,-60px) scale(1.25)}}
@keyframes ehD3{to{transform:translate(-120px,120px) scale(.9)}}
#elh .grid-bg{position:absolute;inset:-48px 0 0 0;opacity:.55;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(75% 55% at 50% 0%,#000 25%,transparent 80%);mask-image:radial-gradient(75% 55% at 50% 0%,#000 25%,transparent 80%);animation:ehGrid 9s linear infinite}
@keyframes ehGrid{to{transform:translateY(48px)}}
#elh #elh-cv{position:absolute;inset:0;width:100%;height:100%;opacity:.8}
#elh .wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 20px}

/* header */
#elh header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:20px 14px;margin:0 -14px;position:sticky;top:0;z-index:30;border:1px solid transparent;border-radius:0 0 22px 22px;transition:padding .35s,background .35s,border-color .35s,box-shadow .35s,top .35s,border-radius .35s}
#elh header.scrolled{top:10px;padding-top:10px;padding-bottom:10px;border-radius:999px;background:color-mix(in srgb,var(--surface) 72%,transparent);border-color:var(--line2);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 18px 40px -20px rgba(0,0,0,.55)}
#elh .brand{display:flex;align-items:center;gap:14px;cursor:pointer}
#elh .brand img{height:32px;width:auto;display:block}
#elh .brand .sep{width:1px;height:22px;background:var(--line2)}
#elh .brand .tag{font-weight:600;font-size:14px;color:var(--muted)}
#elh[data-theme="dark"] .logo-light,#elh[data-theme="light"] .logo-dark{display:none!important}
#elh .hdr-actions{display:flex;align-items:center;gap:8px}
#elh .hsearch{display:none;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;min-width:200px}
#elh.view-inner .hsearch{display:inline-flex}
#elh .hsearch svg{width:15px;height:15px}
#elh .hsearch kbd{margin-left:auto;font-size:11px;padding:1px 6px;border-radius:6px;border:1px solid var(--line2);color:var(--faint)}
#elh .lang{display:flex;gap:2px;padding:3px;border-radius:999px;border:1px solid var(--line2);background:var(--surface)}
#elh .lang button{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 7px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);transition:background .2s,color .2s}
#elh .lang button.on{background:var(--surface2);color:var(--text);box-shadow:0 0 0 1px var(--line2)}
#elh .lang .flag{width:20px;height:14px;border-radius:3px;flex:none;display:block;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
#elh .lang button:not(.on) .flag{opacity:.7}
#elh .btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);font-size:13px;font-weight:600;cursor:pointer;transition:border-color .2s,transform .2s,box-shadow .2s;white-space:nowrap}
#elh .btn:hover{border-color:var(--accent)}
#elh .btn:active{transform:scale(.97)}
#elh .btn.icon{width:36px;padding:0;justify-content:center}
#elh .btn svg{width:16px;height:16px;flex:none}
#elh .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;position:relative;overflow:hidden;box-shadow:0 10px 30px -10px color-mix(in srgb,var(--accent) 70%,transparent)}
#elh .btn.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-100%);animation:ehShine 3.8s ease-in-out infinite}
@keyframes ehShine{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
#elh .btn.big{height:44px;padding:0 18px;font-size:14px;justify-content:center}
#elh .btn.ok{border-color:var(--accent);color:var(--link)}

/* hero + search */
#elh .hero{padding:46px 0 26px;text-align:center}
#elh .kicker{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;border:1px solid var(--line2);background:color-mix(in srgb,var(--surface) 70%,transparent);font-size:12.5px;font-weight:600;color:var(--muted);backdrop-filter:blur(8px)}
#elh .kicker b{color:var(--link);font-weight:700}
#elh h1{margin-top:20px;font-size:clamp(30px,5.4vw,54px);font-weight:800;letter-spacing:-.035em;line-height:1.05;background:linear-gradient(90deg,var(--text) 0%,var(--text) 35%,var(--accent) 50%,var(--text) 65%,var(--text) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:ehRise .9s .1s cubic-bezier(.2,.8,.2,1) both,ehSweep 7s 1.2s ease-in-out infinite}
@keyframes ehSweep{0%{background-position:100% 0}60%,100%{background-position:0 0}}
#elh .hero p.sub{margin:12px auto 0;color:var(--muted);font-size:16.5px;max-width:560px}
#elh .hero > *{animation:ehRise .9s cubic-bezier(.2,.8,.2,1) both}
#elh .hero > :nth-child(3){animation-delay:.18s}
#elh .hero > :nth-child(4){animation-delay:.26s}
#elh .hero > :nth-child(5){animation-delay:.34s}
@keyframes ehRise{from{opacity:0;transform:translateY(22px);filter:blur(8px)}}
#elh .sbox{position:relative;max-width:720px;margin:30px auto 0;z-index:5}
#elh .sfield{position:relative;display:flex;align-items:center;gap:12px;height:62px;padding:0 10px 0 20px;border-radius:20px;background:color-mix(in srgb,var(--surface) 82%,transparent);border:1px solid var(--line2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--shadow);transition:border-color .25s,box-shadow .25s}
#elh .sfield::before{content:"";position:absolute;inset:-1px;border-radius:21px;padding:1px;background:conic-gradient(from var(--ang,0deg),transparent 0 70%,var(--accent) 85%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:ehAng 5s linear infinite;opacity:.8;pointer-events:none}
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes ehAng{to{--ang:360deg}}
#elh .sfield:focus-within{border-color:color-mix(in srgb,var(--accent) 60%,transparent);box-shadow:0 0 0 6px var(--accent-soft),var(--shadow)}
#elh .sfield > svg{width:22px;height:22px;color:var(--muted);flex:none}
#elh .sfield input{flex:1;min-width:0;height:100%;font-size:17px;font-weight:500;outline:none;color:var(--text)}
#elh .sfield input::placeholder{color:var(--faint)}
#elh .sfield kbd{font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px;border:1px solid var(--line2);color:var(--faint);white-space:nowrap}
#elh .sres{position:absolute;left:0;right:0;top:calc(100% + 10px);max-height:min(60vh,520px);overflow:auto;border-radius:18px;background:var(--surface);border:1px solid var(--line2);box-shadow:0 30px 60px -20px rgba(0,0,0,.6);display:none;text-align:left;padding:6px}
#elh .sres.show{display:block;animation:ehPop .22s cubic-bezier(.2,.8,.2,1)}
@keyframes ehPop{from{opacity:0;transform:translateY(-6px) scale(.98)}}
#elh .sres a{display:block;padding:11px 14px;border-radius:12px;cursor:pointer}
#elh .sres a.on,#elh .sres a:hover{background:var(--surface2)}
#elh .sres .r-t{font-weight:700;font-size:14.5px}
#elh .sres .r-p{font-size:12px;color:var(--faint);font-weight:600;margin-top:1px}
#elh .sres .r-x{font-size:13px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#elh mark{background:color-mix(in srgb,var(--accent) 30%,transparent);color:inherit;border-radius:3px;padding:0 1px}
#elh .sres .r-more{padding:10px 14px;font-size:13px;color:var(--link);font-weight:700}
#elh .sres .r-none{padding:18px;color:var(--muted);text-align:center}
#elh .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:18px}
#elh .chip{font-size:13px;font-weight:600;padding:6px 13px;border-radius:999px;background:color-mix(in srgb,var(--surface) 75%,transparent);border:1px solid var(--line);color:var(--muted);cursor:pointer;transition:all .2s}
#elh .chip:hover{color:var(--text);border-color:var(--accent);transform:translateY(-1px)}
#elh .stats{display:flex;justify-content:center;gap:28px;margin-top:26px;color:var(--muted);font-size:13px;font-weight:600}
#elh .stats b{color:var(--text);font-weight:800;font-size:15px;margin-right:4px}

/* cards */
#elh .card{position:relative;background:color-mix(in srgb,var(--surface) 78%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
#elh .card::before,#elh .card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .4s}
#elh .card::before{background:radial-gradient(520px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--accent) 7%,transparent),transparent 45%)}
#elh .card::after{padding:1px;background:radial-gradient(360px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--accent) 70%,transparent),transparent 50%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
#elh .card:hover::before,#elh .card:hover::after{opacity:1}
#elh .card > *{position:relative;z-index:1}
#elh section.block{margin-top:40px}
#elh .block-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
#elh h2{font-size:19px;font-weight:800;letter-spacing:-.015em}
#elh .block-h small{font-size:13px;color:var(--muted)}
#elh .pop{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;padding:8px}
#elh .pop a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;font-weight:600;font-size:14.5px;cursor:pointer;transition:background .2s}
#elh .pop a:hover{background:var(--surface2)}
#elh .pop a .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--link);flex:none}
#elh .pop a .ic svg{width:16px;height:16px}
#elh .pop a span{flex:1;min-width:0}
#elh .pop a .ar{width:16px;height:16px;color:var(--faint);transition:transform .2s}
#elh .pop a:hover .ar{transform:translateX(3px);color:var(--link)}
#elh .cats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
#elh .cat{padding:20px;cursor:pointer;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#elh .cat:hover{transform:translateY(-3px)}
#elh .cat .ci{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--link);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s}
#elh .cat:hover .ci{transform:rotate(-6deg) scale(1.08);box-shadow:0 0 26px -4px color-mix(in srgb,var(--accent) 60%,transparent)}
#elh .cat .ci svg{width:21px;height:21px}
#elh .cat h3{margin-top:14px;font-size:16px;font-weight:700}
#elh .cat p{margin-top:4px;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px}
#elh .cat .cnt{margin-top:12px;font-size:12px;font-weight:700;color:var(--faint)}
#elh .reveal{opacity:0;transform:translateY(28px);filter:blur(6px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1),filter .8s}
#elh .reveal.in{opacity:1;transform:none;filter:none}
#elh .stag > *{animation:ehRise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--n,0) * 35ms)}

/* inner pages */
#elh .crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);margin:22px 0 14px}
#elh .crumbs a{cursor:pointer}
#elh .crumbs a:hover{color:var(--link)}
#elh .crumbs i{color:var(--faint);font-style:normal}
#elh .page-h{display:flex;align-items:center;gap:16px;margin-bottom:22px}
#elh .page-h .ci{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--accent-soft);color:var(--link);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);flex:none}
#elh .page-h .ci svg{width:26px;height:26px}
#elh .page-h h1{margin:0;font-size:clamp(26px,4vw,38px)}
#elh .page-h p{color:var(--muted);font-size:14px;margin-top:2px}
#elh .folder{margin-bottom:14px;overflow:hidden}
#elh .folder > button{display:flex;align-items:center;gap:10px;width:100%;padding:16px 20px;text-align:left;cursor:pointer}
#elh .folder > button b{font-weight:700;font-size:15.5px;flex:1}
#elh .folder > button .count{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface2);border:1px solid var(--line);padding:1px 8px;border-radius:999px}
#elh .chev{width:18px;height:18px;flex:none;color:var(--muted);transition:transform .25s}
#elh .folder.open .chev{transform:rotate(90deg)}
#elh .f-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.2,.8,.2,1)}
#elh .folder.open .f-body{grid-template-rows:1fr}
#elh .f-in{overflow:hidden;min-height:0}
#elh .f-in ul{padding:0 10px 10px}
#elh .alist a{display:flex;align-items:flex-start;gap:12px;padding:11px 12px;border-radius:12px;cursor:pointer;transition:background .2s}
#elh .alist a:hover{background:var(--surface2)}
#elh .alist a svg{width:16px;height:16px;margin-top:3px;color:var(--faint);flex:none}
#elh .alist a b{display:block;font-weight:600;font-size:14.5px}
#elh .alist a small{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;color:var(--muted)}

/* article */
#elh .art-wrap{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:34px;align-items:start}
#elh .art{padding:34px 40px 40px}
#elh .art h1.at{margin:0 0 10px;font-size:clamp(26px,3.6vw,36px);line-height:1.15;-webkit-text-fill-color:currentColor;background:none;animation:none}
#elh .art .meta{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--muted);font-weight:600;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:24px}
#elh .art .meta span{display:inline-flex;align-items:center;gap:6px}
#elh .art .meta svg{width:14px;height:14px}
#elh .tr-note{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#elh .tr-note svg{width:16px;height:16px;color:var(--accent);flex:none}
#elh .tr-note span{flex:1;min-width:160px}
#elh .tr-note button{font:inherit;font-weight:700;color:var(--link);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
#elh .prose font{background:none!important;box-shadow:none!important}
body{top:0!important}
.goog-te-banner-frame,iframe.skiptranslate,body>.skiptranslate,#goog-gt-tt,.goog-te-balloon-frame,.goog-tooltip,.VIpgJd-ZVi9od-ORHb-OEVmcd,.VIpgJd-ZVi9od-aZ2wEe-wOHMyf,.VIpgJd-ZVi9od-aZ2wEe-OiiCO{display:none!important}
.goog-text-highlight{background:none!important;box-shadow:none!important}
#elh .note{font-size:13px;color:var(--muted);background:var(--surface2);border:1px solid var(--line);padding:10px 14px;border-radius:12px;margin-bottom:20px}
#elh .prose{font-size:16px;line-height:1.75;color:color-mix(in srgb,var(--text) 90%,var(--muted));overflow-wrap:anywhere}
#elh .prose > * + *{margin-top:14px}
#elh .prose h2{margin-top:38px;font-size:22px;font-weight:800;color:var(--text);letter-spacing:-.015em;scroll-margin-top:100px}
#elh .prose h3{margin-top:28px;font-size:18px;font-weight:700;color:var(--text);scroll-margin-top:100px}
#elh .prose h4{margin-top:22px;font-size:16px;font-weight:700;color:var(--text)}
#elh .prose strong,#elh .prose b{font-weight:700;color:var(--text)}
#elh .prose em,#elh .prose i{font-style:italic}
#elh .prose u{text-decoration:underline}
#elh .prose a{color:var(--link);text-decoration:underline;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--link) 40%,transparent);cursor:pointer}
#elh .prose ul{padding-left:22px}
#elh .prose ul li{list-style:disc}
#elh .prose ol{padding-left:22px}
#elh .prose ol li{list-style:decimal}
#elh .prose li + li{margin-top:6px}
#elh .prose li::marker{color:var(--accent)}
#elh .prose hr{height:1px;background:var(--line);margin:26px 0}
#elh .prose img{max-width:100%;height:auto;border-radius:14px;border:1px solid var(--line2);box-shadow:0 20px 40px -20px rgba(0,0,0,.5);cursor:zoom-in;display:block;margin:18px 0;background:var(--surface2)}
#elh .prose iframe{width:100%;aspect-ratio:16/9;height:auto;border-radius:14px;border:1px solid var(--line2);display:block;margin:18px 0}
#elh .prose table{width:100%;border-collapse:collapse;font-size:14px;display:block;overflow-x:auto}
#elh .prose td,#elh .prose th{border:1px solid var(--line2);padding:9px 12px;vertical-align:top}
#elh .prose th{background:var(--surface2);font-weight:700}
#elh .prose blockquote{border-left:3px solid var(--accent);padding:10px 16px;background:var(--accent-soft);border-radius:0 12px 12px 0}
#elh .prose code,#elh .prose kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em;background:var(--surface2);border:1px solid var(--line);padding:1px 6px;border-radius:6px}
#elh .prose pre{background:var(--surface2);border:1px solid var(--line);padding:14px;border-radius:12px;overflow:auto}
#elh .prose pre code{border:0;padding:0;background:none}
#elh .prose .toc-h,#elh .prose .toc-h + ul{display:none}
#elh .prose .toc-h + ul + hr{display:none}
#elh .side{position:sticky;top:96px}
#elh .side .card{padding:18px}
#elh .side h4{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
#elh .toc a{display:block;font-size:13.5px;color:var(--muted);padding:5px 0 5px 12px;border-left:2px solid var(--line);cursor:pointer;transition:color .2s,border-color .2s}
#elh .toc a:hover{color:var(--text)}
#elh .toc a.on{color:var(--link);border-color:var(--accent);font-weight:600}
#elh .side .card + .card{margin-top:14px}
#elh .rel a{display:block;font-size:13.5px;font-weight:600;padding:7px 0;border-bottom:1px dashed var(--line);cursor:pointer}
#elh .rel a:last-child{border-bottom:0}
#elh .rel a:hover{color:var(--link)}
#elh .art-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}
#elh .progress{position:fixed;left:0;top:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(var(--p,0));background:linear-gradient(90deg,var(--accent),#4FD1C5);z-index:60;box-shadow:0 0 12px var(--accent);display:none}
#elh.view-article .progress{display:block}

/* lightbox */
#elh .lb{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.82);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
#elh .lb.show{display:flex;animation:ehPop .2s}
#elh .lb img{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.6)}

/* support + footer */
#elh .support{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;padding:28px 30px;overflow:hidden;background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 10%,color-mix(in srgb,var(--surface) 80%,transparent)),color-mix(in srgb,var(--surface) 78%,transparent) 55%)}
#elh .sup-icon{position:relative;width:60px;height:60px;border-radius:18px;display:grid;place-items:center;background:var(--accent-soft);color:var(--link);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);box-shadow:0 0 30px -4px color-mix(in srgb,var(--accent) 45%,transparent)}
#elh .sup-icon::after{content:"";position:absolute;inset:-7px;border-radius:22px;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);animation:ehRip 2.8s ease-out infinite}
@keyframes ehRip{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.25);opacity:0}}
#elh .sup-icon svg{width:28px;height:28px}
#elh .support .k{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--link);margin-bottom:4px}
#elh .support h2{font-size:22px}
#elh .support p{margin-top:6px;color:var(--muted);font-size:14.5px;max-width:520px}
#elh .sup-actions{display:flex;flex-direction:column;gap:8px}
#elh footer{margin-top:56px;padding:28px 0 40px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
#elh footer img{height:22px;width:auto;opacity:.9}
#elh footer nav{display:flex;gap:18px;flex-wrap:wrap}
#elh footer a:hover{color:var(--text)}
#elh .skel{height:14px;border-radius:8px;background:linear-gradient(90deg,var(--surface2),var(--line2),var(--surface2));background-size:200% 100%;animation:ehSk 1.4s infinite}
@keyframes ehSk{to{background-position:-200% 0}}
#elh .err{margin:30px auto;max-width:560px;padding:14px 18px;border-radius:14px;border:1px solid rgba(242,99,95,.4);background:rgba(242,99,95,.08);font-size:14px;text-align:center}
#elh .view{animation:ehView .5s cubic-bezier(.2,.8,.2,1)}
@keyframes ehView{from{opacity:0;transform:translateY(14px)}}

#elh .art,#elh .art-wrap > *{min-width:0}
#elh .prose *{max-width:100%}
#elh .prose pre,#elh .prose code{white-space:pre-wrap;word-break:break-word}
@media (max-width:900px){
  #elh .art-wrap{grid-template-columns:minmax(0,1fr)}
  #elh .side{position:static}
  #elh .toc-card{display:none}
  #elh .cats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:640px){
  #elh .wrap{padding:0 16px}
  #elh header{margin:0 -8px;padding-left:8px;padding-right:8px}
  #elh .brand img{height:27px}
  #elh .brand .sep,#elh .brand .tag{display:none}
  #elh .lang span{display:none}
  #elh .lang button{padding:0 7px}
  #elh .hdr-actions{gap:6px}
  #elh.view-inner .hsearch{min-width:0;width:36px;padding:0;justify-content:center}
  #elh .hsearch span,#elh .hsearch kbd{display:none}
  #elh .hero{padding-top:26px}
  #elh .sfield{height:56px;border-radius:18px;padding-left:16px}
  #elh .sfield input{font-size:16px}
  #elh .sfield kbd{display:none}
  #elh .pop{grid-template-columns:1fr}
  #elh .cats{grid-template-columns:1fr;gap:10px}
  #elh .cat{display:grid;grid-template-columns:auto 1fr;column-gap:14px;padding:16px}
  #elh .cat .ci{grid-row:span 3}
  #elh .cat h3{margin-top:0}
  #elh .cat p{min-height:0}
  #elh .cat .cnt{margin-top:6px}
  #elh .stats{gap:16px;font-size:12px}
  #elh .art{padding:22px 18px 26px}
  #elh .prose{font-size:15.5px}
  #elh .support{grid-template-columns:1fr;padding:24px 20px;gap:16px}
  #elh .btn.big{width:100%}
  #elh .a1{width:420px;height:420px;margin-left:-210px;top:-220px}
}
@media (prefers-reduced-motion:reduce){#elh *{animation:none!important;transition:none!important}}

    if (img){ var lb = $("elh-lb"); lb.querySelector("img").src = img.src; lb.classList.add("show"); }
  });
  $("elh-lb").addEventListener("click", function(){ this.classList.remove("show"); });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape") $("elh-lb").classList.remove("show");
    if ((e.key === "k" && (e.metaKey || e.ctrlKey)) || (e.key === "/" && !/input|textarea/i.test(document.activeElement.tagName))){ e.preventDefault(); focusSearch(); }
  });
  function focusSearch(){ var i = $("elh-q") || $("elh-q2"); if (i){ i.focus(); i.scrollIntoView({ block:"center", behavior:"smooth" }); } else { location.hash = "#/"; setTimeout(function(){ var j = $("elh-q"); if (j) j.focus(); }, 80); } }
  $("elh-hs").addEventListener("click", focusSearch);

  /* ---------- router ---------- */
  function route(){
    if (!IDX) return;
    var h = location.hash.replace(/^#\/?/, ""), p = h.split("/");
    if (p[0] === "a" && p[1]) viewArticle(p[1]);
    else if (p[0] === "c" && p[1]) viewCat(p[1], p[2]);
    else if (p[0] === "s" && p[1]) viewSearch(decodeURIComponent(p.slice(1).join("/")));
    else viewHome();
    if (!(p[0] === "a")) window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);

  /* ---------- motion ---------- */
  function reveal(){
    var els = root.querySelectorAll(".reveal:not(.in)");
    if (!("IntersectionObserver" in window) || REDUCED){ els.forEach(function(el){ el.classList.add("in"); }); return; }
    var io = new IntersectionObserver(function(es){ es.forEach(function(x){ if (x.isIntersecting){ x.target.classList.add("in"); io.unobserve(x.target); } }); }, { rootMargin:"0px 0px -6% 0px" });
    els.forEach(function(el){ io.observe(el); });
  }
  root.addEventListener("pointermove", function(e){
    var c = e.target.closest && e.target.closest(".card"); if (!c) return;
    var r = c.getBoundingClientRect(); c.style.setProperty("--mx", (e.clientX - r.left) + "px"); c.style.setProperty("--my", (e.clientY - r.top) + "px");
  }, { passive:true });
  function onScroll(){ $("elh-hdr").classList.toggle("scrolled", (window.scrollY || document.documentElement.scrollTop) > 12); }
  window.addEventListener("scroll", onScroll, { passive:true }); onScroll();
  (function(){
    var cv = $("elh-cv"); if (!cv || !cv.getContext || REDUCED) return;
    var ctx = cv.getContext("2d"), W, H, dpr = Math.min(2, window.devicePixelRatio || 1), Pn = [], mouse = { x:-9999, y:-9999 }, col = "200,226,106";
    function size(){ W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); var n = Math.round(Math.min(60, Math.max(20, W * H / 26000))); Pn = []; for (var i = 0; i < n; i++) Pn.push({ x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-.5)*.22, vy:(Math.random()-.5)*.22, r:Math.random()*1.3+.5 }); }
    window.addEventListener("resize", size); window.addEventListener("pointermove", function(e){ mouse.x = e.clientX; mouse.y = e.clientY; }, { passive:true }); size();
    (function frame(){
      requestAnimationFrame(frame); if (document.hidden) return;
      col = root.getAttribute("data-theme") === "light" ? "120,150,20" : "200,226,106";
      ctx.clearRect(0, 0, W, H); var a = root.getAttribute("data-theme") === "light" ? .6 : 1, L = 130;
      for (var i = 0; i < Pn.length; i++){
        var p = Pn[i], dx = p.x - mouse.x, dy = p.y - mouse.y, d2 = dx*dx + dy*dy;
        if (d2 < 14400){ var f = (1 - d2/14400) * .6; p.x += dx/120*f; p.y += dy/120*f; }
        p.x += p.vx; p.y += p.vy; if (p.x < -10) p.x = W + 10; if (p.x > W + 10) p.x = -10; if (p.y < -10) p.y = H + 10; if (p.y > H + 10) p.y = -10;
        for (var j = i + 1; j < Pn.length; j++){ var q = Pn[j], ex = p.x - q.x, ey = p.y - q.y, e2 = ex*ex + ey*ey; if (e2 < L*L){ ctx.strokeStyle = "rgba(" + col + "," + ((1 - Math.sqrt(e2)/L) * .2 * a) + ")"; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke(); } }
        ctx.fillStyle = "rgba(" + col + "," + (.5 * a) + ")"; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
      }
    })();
  })();

  /* ---------- language / theme / misc ---------- */
  function copyText(s, done){
    function fb(){ var t = document.createElement("textarea"); t.value = s; t.style.position = "fixed"; t.style.opacity = "0"; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); } catch(_){} t.remove(); done(); }
    try { navigator.clipboard.writeText(s).then(done, fb); } catch(_){ fb(); }
  }
  $("elh-copy").addEventListener("click", function(){ var b = this, l = b.querySelector("span"); copyText(SUPPORT[LANG], function(){ b.classList.add("ok"); l.textContent = T("copied"); setTimeout(function(){ b.classList.remove("ok"); l.textContent = T("copy"); }, 1800); }); });
  function setLang(l, save){
    LANG = I18N[l] ? l : "en";
    root.setAttribute("lang", LANG === "pt" ? "pt-BR" : "en");
    root.querySelectorAll("[data-i18n]").forEach(function(el){ el.textContent = T(el.getAttribute("data-i18n")); });
    root.querySelectorAll(".lang button").forEach(function(b){ var on = b.getAttribute("data-lang") === LANG; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
    var site = SITE[LANG]; $("elh-site").href = site; $("elh-site").textContent = site.replace(/^https?:\/\//, "").replace(/\/$/, "");
    $("elh-mail").href = "mailto:" + SUPPORT[LANG]; $("elh-mail-t").textContent = SUPPORT[LANG];
    $("elh-theme").setAttribute("aria-label", T("themeAria"));
    if (save){ try { localStorage.setItem("elv-lang", LANG); } catch(_){} }
    if (IDX) route();
  }
  root.querySelectorAll(".lang button").forEach(function(b){ b.addEventListener("click", function(){ setLang(b.getAttribute("data-lang"), true); }); });
  function setTheme(t, save){
    root.setAttribute("data-theme", t); $("elh-theme").innerHTML = ic(t === "dark" ? "sun" : "moon");
    var bg = getComputedStyle(root).getPropertyValue("--bg"); document.documentElement.style.background = bg; if (document.body) document.body.style.background = bg;
    if (save){ try { localStorage.setItem("elv-theme", t); } catch(_){} }
  }
  var th = null; try { th = localStorage.getItem("elv-theme"); } catch(_){}
  var qt = /[?&]theme=(light|dark)/.exec(location.search); if (qt) th = qt[1];
  setTheme(th || (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
  $("elh-theme").addEventListener("click", function(){ setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark", true); });
  var lg = null; try { lg = localStorage.getItem("elv-lang"); } catch(_){}
  var ql = /[?&]lang=(pt|en)/i.exec(location.search); if (ql) lg = ql[1].toLowerCase();
  if (!lg){ var nav = (navigator.languages && navigator.languages[0]) || navigator.language || ""; lg = /^pt/i.test(nav) ? "pt" : "en"; }
  try { if (FAVICON.indexOf("{{") !== 0){ var lk = document.querySelector("link[rel~='icon']") || document.createElement("link"); lk.rel = "icon"; lk.href = FAVICON; document.head.appendChild(lk); } } catch(_){}
  $("elh-year").textContent = new Date().getFullYear();
  $("elh-f-dark").src = root.querySelector("header .logo-dark").src; $("elh-f-light").src = root.querySelector("header .logo-light").src;
  setLang(lg); reveal(); load();
})();
</script>
